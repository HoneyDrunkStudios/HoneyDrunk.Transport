name: PR

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pr-core:
    name: PR Core
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
      security-events: write  # CodeQL SARIF upload
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/pr-core.yml@main
    with:
      dotnet-version: '10.0.x'
      configuration: 'Release'
      runs-on: 'ubuntu-latest'
      working-directory: 'HoneyDrunk.Transport'
      enable-secret-scan: true
      enable-accessibility-check: false
      post-pr-summary: true
      patch-coverage-threshold: 75
      absolute-coverage-floor: 70
      actions-ref: 'main'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: SonarQube Cloud
    # Runs on:
    #   - pull_request (same-repo, after pr-core succeeds) for PR-time analysis
    #   - push to main (standalone) for main-branch analysis that populates the
    #     SonarCloud Overview dashboard and leak-period baseline.
    # `always()` is required because pr-core is skipped on push events; without
    # it, GitHub Actions skips downstream jobs whose declared `needs:` was skipped.
    if: |
      always() && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.pr-core.result == 'success') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    needs: pr-core
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-sonarcloud.yml@20166f0d62b7027ad46130ec2c8f4eb652e0ffa5
    with:
      dotnet-version: '10.0.x'
      runs-on: 'ubuntu-latest'
      working-directory: 'HoneyDrunk.Transport'
      collect-failure-findings: true
      sonar-organization: 'honeydrunkstudios'
      sonar-project-key: 'honeydrunkstudios_HoneyDrunk.Transport'
      coverage-artifact-name: 'coverage-reports-ubuntu-latest'
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # The scanner must finish successfully before querying PR findings. Its
  # awaited server-side gate remains authoritative for this analysis run.
  sonar-findings:
    name: Sonar New-Code Findings
    needs: sonarcloud
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.sonarcloud.result == 'success'
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-sonarcloud-quality-gate.yml@68f5db6e2e3a9ed94aee9b3e27f1ebfea59bccc4
    with:
      sonar-organization: 'honeydrunkstudios'
      sonar-project-key: 'honeydrunkstudios_HoneyDrunk.Transport'
      mode: enforce
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  pr-status:
    name: PR Status
    needs: [pr-core, sonarcloud, sonar-findings]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require eligible checks
        env:
          CORE_RESULT: ${{ needs.pr-core.result }}
          SCANNER_RESULT: ${{ needs.sonarcloud.result }}
          FINDINGS_RESULT: ${{ needs.sonar-findings.result }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CORE_RESULT" != "success" ]]; then
            echo "::error::PR Core did not succeed ($CORE_RESULT)."
            exit 1
          fi
          if [[ "$SAME_REPOSITORY" == "true" ]]; then
            if [[ "$SCANNER_RESULT" != "success" || "$FINDINGS_RESULT" != "success" ]]; then
              echo "::error::Required Sonar checks did not succeed (scanner=$SCANNER_RESULT, findings=$FINDINGS_RESULT)."
              exit 1
            fi
          elif [[ "$SCANNER_RESULT" == "skipped" && "$FINDINGS_RESULT" == "skipped" ]]; then
            echo "Fork PR: Sonar checks are ineligible because repository secrets are unavailable."
          else
            echo "::error::Unexpected Sonar results for a fork PR (scanner=$SCANNER_RESULT, findings=$FINDINGS_RESULT)."
            exit 1
          fi

  coverage-baseline-ratchet:
    name: Coverage Baseline Ratchet
    if: github.event_name == 'push'
    permissions:
      contents: write
      checks: write
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/coverage-baseline-ratchet.yml@main
    with:
      dotnet-version: '10.0.x'
      configuration: 'Release'
      runs-on: 'ubuntu-latest'
      working-directory: 'HoneyDrunk.Transport'
      actions-ref: 'main'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
